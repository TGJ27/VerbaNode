name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt soundfile sounddevice
      - name: Ruff correctness checks
        run: python -m ruff check app scripts tests
      - name: Release invariants and syntax
        run: python scripts/release/verify_release.py
      - name: Test
        run: python -m pytest -q
